[project]
name = "changefeed"
version = "0.1.0"
description = "Versioned job postings from public ATS boards, with hourly change files"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "httpx>=0.27"]

[project.scripts]
changefeed = "changefeed.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changefeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
